name: Conventional Commits Check

# Reusable workflow. Call it from a pull_request workflow, pinned to a release
# tag or commit SHA (not @main):
#
#   on: pull_request
#   jobs:
#     commits:
#       uses: StudioDrave/.github/.github/workflows/conventional-commits.yml@v1  # or a full SHA
#
# Only meaningful on pull_request events; on any other caller event the job
# is skipped.

on:
  workflow_call:
    # No inputs needed — works the same for every repo

permissions:
  contents: read

jobs:
  check:
    name: Validate commit messages
    # base/head SHAs only exist on pull_request events
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install commitlint
        # --no-save: don't create or modify package.json / lockfile in the caller's repo
        run: npm install --no-save @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Write commitlint config
        # Written outside the workspace so a repo's own commitlint config is never overwritten
        run: |
          cat > "$RUNNER_TEMP/commitlint.config.cjs" << EOF
          module.exports = {
            extends: [require.resolve('$PWD/node_modules/@commitlint/config-conventional')],
            rules: {
              'type-enum': [2, 'always', [
                'feat', 'fix', 'docs', 'chore', 'refactor',
                'test', 'style', 'perf', 'ci', 'build', 'revert'
              ]],
              'subject-case': [0],
              'body-max-line-length': [0],
            }
          };
          EOF

      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --no-install commitlint \
            --config "$RUNNER_TEMP/commitlint.config.cjs" \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --verbose
